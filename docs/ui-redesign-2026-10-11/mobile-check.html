<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>375px 移动端验证框 — localhost:4200</title>
<style>
  body { margin: 0; background: #3a3f3c; display: flex; gap: 24px; padding: 16px; font-family: sans-serif; }
  .frame { width: 375px; height: 700px; border: 2px solid #111; border-radius: 18px; overflow: hidden; background: #fff; flex: none; }
  iframe { width: 100%; height: 100%; border: 0; }
  .label { color: #fff; font-size: 12px; text-align: center; padding-top: 6px; }
</style>
</head>
<body>
  <div>
    <div class="frame"><iframe src="http://localhost:4200/" title="首页 375px"></iframe></div>
    <div class="label">/ 首页</div>
  </div>
  <div>
    <div class="frame"><iframe src="http://localhost:4200/auth" title="登录 375px"></iframe></div>
    <div class="label">/auth 登录门户</div>
  </div>
</body>
</html>
