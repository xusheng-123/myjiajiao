@if (lattice()) {
  <div class="garden-lattice-bg" aria-hidden="true"></div>
}
@if (moonGate()) {
  <div class="moon-gate-portal" aria-hidden="true"></div>
}
@if (rain()) {
  <div class="rain-layer" aria-hidden="true">
    <div class="rain-line rain-1"></div>
    <div class="rain-line rain-2"></div>
    <div class="rain-line rain-3"></div>
    <div class="rain-line rain-4"></div>
  </div>
}
