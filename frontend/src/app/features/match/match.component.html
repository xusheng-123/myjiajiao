<div class="match-shell">
  <header class="match-header">
    <div class="match-title-col">
      <h1 class="match-title nur-serif">找老师 · 需求匹配与分步预约</h1>
      <p class="match-subtitle">填写学习目标，系统为你精选同频导师；从挑选师资到预约锁定，四步透明完成。</p>
    </div>
    <a routerLink="/student/dashboard" class="back-link">
      <span aria-hidden="true">←</span> 返回学生工作台
    </a>
  </header>

  @if (favNotice()) {
    <div class="match-notice" role="status">
      <span aria-hidden="true">ℹ</span> {{ favNotice() }}
    </div>
  }

  <!-- 步骤条 -->
  <nur-match-stepper
    [currentStep]="step()"
    [maxReachedStep]="maxReachedStep()"
    (stepChange)="goToStep($event)"
  />

  <!-- 步骤容器 -->
  <div class="step-container">
    @if (step() === 1) {
      <nur-match-demand-step
        [draft]="demandDraft()"
        (draftChange)="demandDraft.set($event)"
        [demandSuccess]="demandSuccess()"
        [demandPublishing]="demandPublishing()"
        [myDemands]="myDemands()"
        (proceed)="onProceedFromDemand()"
        (publish)="onPublishDemand()"
      />
    }

    @if (step() === 2) {
      <nur-match-recommend-step
        [candidates]="candidates()"
        [filteredCandidates]="filteredCandidates()"
        [loading]="loading()"
        [timeFilter]="timeFilter()"
        [favoriteIds]="favoriteIds()"
        [favBusyIds]="favBusyIds()"
        [consultBusy]="consultBusy()"
        [compared]="compared()"
        [demandSubject]="demandDraft().subject"
        (selectTeacher)="onSelectTeacher($event)"
        (toggleFavorite)="toggleFavorite($event)"
        (consult)="consult($event)"
        (toggleCompare)="toggleCompare($event)"
        (removeCompare)="removeCompare($event)"
        (timeFilterChange)="setTimeFilter($event)"
        (backToDemand)="step.set(1)"
      />
    }

    @if (step() === 3 && wizardTeacher(); as t) {
      <nur-match-slots-step
        [teacher]="t"
        [bookingType]="bookingType()"
        [slots]="wizardSlots()"
        [selectedSlot]="selectedSlot()"
        [trialAvailable]="trialAvailable()"
        [trialReason]="trialReason()"
        [slotInvalid]="slotInvalid()"
        (pickSlot)="onPickSlot($event)"
        (switchType)="onSwitchBookingType($event)"
        (toConfirmStep)="onToConfirmStep()"
        (backToRecommend)="step.set(2)"
      />
    }

    @if (step() === 4 && wizardTeacher(); as t) {
      <nur-match-confirm-step
        [teacher]="t"
        [bookingType]="bookingType()"
        [selectedSlot]="selectedSlot()"
        [submitting]="submitting()"
        [wizardSuccess]="wizardSuccess()"
        [wizardNotice]="wizardNotice()"
        (submitBooking)="submitBooking()"
        (backToSlots)="step.set(3)"
        (finish)="onResetWizard()"
      />
    }
  </div>
</div>
