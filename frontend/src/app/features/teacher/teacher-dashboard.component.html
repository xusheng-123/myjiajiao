<div class="dashboard-shell">
  <!-- 顶栏欢迎区 -->
  <header class="dash-header nur-enter" style="--stagger-index: 1">
    <div class="header-main">
      <div class="greeting-row">
        <span class="header-eyebrow">NURTURE · 导师空间</span>
        <h1 class="dash-greeting nur-serif">导师工作台 · {{ displayName() }}</h1>
      </div>
      <p class="dash-subtitle">认真准备好每一场雨，静候学海生花。</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-ghost-sm" (click)="auth.logout()" aria-label="退出登录">
        退出登录
      </button>
    </div>
  </header>

  <!-- 快捷服务导航胶囊条 -->
  <nav class="quick-nav-bar nur-enter" style="--stagger-index: 2" aria-label="教学协同快捷入口">
    <a routerLink="/messages" class="nav-chip">课前咨询与回复</a>
    <a routerLink="/learning/plans" class="nav-chip">学生学习计划</a>
    <a routerLink="/learning/mistakes" class="nav-chip">学生错题本</a>
    <a routerLink="/learning/materials" class="nav-chip">教学资料与作业</a>
    <a routerLink="/learning/assessments" class="nav-chip">阶段小测与报告</a>
    <a routerLink="/scheduling/series" class="nav-chip">重复档期日历</a>
    <a routerLink="/support" class="nav-chip">客服与申诉</a>
  </nav>

  <!-- 教师公开名片与主页资料编辑 -->
  <div class="profile-editor-host nur-enter" style="--stagger-index: 3">
    <nur-teacher-profile-editor />
  </div>

  <!-- 今日行动聚焦：今日课表卡置顶（高信息密度，包含 A1 取消 / A2 开始·结课 / B6 课前任务 / 考勤） -->
  <div class="pinned-card-section nur-enter" style="--stagger-index: 4">
    <nur-today-lessons-card (recordLesson)="onRecordLesson($event)" />
  </div>

  <!-- 次级分区选择器（ADHD 友好：聚焦当前工作任务，降低认知过载） -->
  <div class="section-tabs-bar nur-enter" style="--stagger-index: 5" role="tablist" aria-label="工作台分区">
    <button
      type="button"
      class="tab-btn"
      role="tab"
      [attr.aria-selected]="activeTab() === 'all'"
      [class.tab-btn--active]="activeTab() === 'all'"
      (click)="switchTab('all')"
    >
      全部面板
    </button>
    <button
      type="button"
      class="tab-btn"
      role="tab"
      [attr.aria-selected]="activeTab() === 'teaching'"
      [class.tab-btn--active]="activeTab() === 'teaching'"
      (click)="switchTab('teaching')"
    >
      教学与学员（4）
    </button>
    <button
      type="button"
      class="tab-btn"
      role="tab"
      [attr.aria-selected]="activeTab() === 'business'"
      [class.tab-btn--active]="activeTab() === 'business'"
      (click)="switchTab('business')"
    >
      档期与经营（5）
    </button>
  </div>

  <!-- 卡片工作网格 -->
  <main class="dashboard-grid">
    <!-- 第一组：教学履约与学员服务 (Booking / Records / Students / Reviews) -->
    @if (activeTab() === 'all' || activeTab() === 'teaching') {
      <div class="grid-column grid-column--teaching">
        <!-- 预约审批 -->
        <nur-booking-requests-card />

        <!-- 课堂记录录入与列表 (B4) -->
        <div id="lesson-records-section">
          <nur-lesson-records-card #lessonRecordsCard />
        </div>

        <!-- 我的学生与档案查看 (B5) -->
        <nur-my-students-card />

        <!-- 学员评价反馈 (C2) -->
        <nur-student-reviews-card />
      </div>
    }

    <!-- 第二组：档期、定价、资质与结算 (Availability / Subjects / Settlement / Verification / Demands) -->
    @if (activeTab() === 'all' || activeTab() === 'business') {
      <div class="grid-column grid-column--business">
        <!-- 档期排定 -->
        <nur-availability-card />

        <!-- 课程与定价管理 -->
        <nur-subjects-pricing-card />

        <!-- 课酬结算流水 -->
        <nur-settlement-card />

        <!-- 资质认证 -->
        <nur-verification-card />

        <!-- 学生需求池 -->
        <nur-open-demands-card />
      </div>
    }
  </main>

  <!-- 消息通知中心浮层 -->
  <nur-notice-center />
</div>
