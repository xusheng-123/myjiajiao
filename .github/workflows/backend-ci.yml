# 润物细无声 · Nurture — 后端 CI（PRD 第 4 章：CI 执行单测、集成测试、静态检查和构建 OCI Image）
name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: 静态检查与测试（含 Flyway 迁移可执行性校验）
        working-directory: backend
        run: mvn -B verify

      - name: 构建 OCI 镜像（交付物校验，推送由 CD 阶段处理）
        working-directory: backend
        run: docker build -t nurture-backend:${{ github.sha }} .

      # 后端部署在 Linux VM，经 Cloudflare Tunnel/WAF 暴露 API，不暴露服务器端口；
      # 发布动作由运维在受控环境执行（首版不需要 Kubernetes）。
